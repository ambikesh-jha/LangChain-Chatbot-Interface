<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bot Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f9;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            box-sizing: border-box;
        }
        .chat-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        .chat-box {
            display: flex;
            flex-direction: column;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fafafa;
        }
        .chat-box .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
        }
        .chat-box .user-message {
            background-color: #007bff;
            color: #fff;
            align-self: flex-end;
        }
        .chat-box .bot-message {
            background-color: #eee;
            color: #333;
            align-self: flex-start;
        }
        .input-container {
            display: flex;
            margin-top: 10px;
        }
        .input-container input {
            flex: 1;
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 10px;
        }
        .input-container button {
            padding: 10px 15px;
            font-size: 1em;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .input-container button:hover {
            background-color: #0056b3;
        }
    </style>
    <script>
        async function askQuestion() {
            const question = document.getElementById("question").value;
            const responseBox = document.getElementById("chat-box");
            
            if (!question.trim()) {
                alert("Please enter a question.");
                return;
            }

            // Display user's message in the chat box
            const userMessage = document.createElement("div");
            userMessage.className = "message user-message";
            userMessage.innerText = question;
            responseBox.appendChild(userMessage);

            // Clear the input field and show loading message
            document.getElementById("question").value = "";
            const botLoadingMessage = document.createElement("div");
            botLoadingMessage.className = "message bot-message";
            botLoadingMessage.innerText = "Loading...";
            responseBox.appendChild(botLoadingMessage);

            // Fetch bot response
            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ question: question }),
                });
                const data = await response.json();
                
                // Remove loading message
                responseBox.removeChild(botLoadingMessage);
                
                // Display bot's message
                const botMessage = document.createElement("div");
                botMessage.className = "message bot-message";
                botMessage.innerText = data.answer || "Error: No response.";
                responseBox.appendChild(botMessage);

                // Scroll to the bottom of the chat box
                responseBox.scrollTop = responseBox.scrollHeight;
            } catch (error) {
                botLoadingMessage.innerText = "Error fetching response. Please try again.";
                console.error("Error:", error);
            }
        }
    </script>
</head>
<body>
    <div class="chat-container">
        <div class="chat-title">Smart-Bot</div>
        <div id="chat-box" class="chat-box">
            <!-- Messages will appear here -->
        </div>
        <div class="input-container">
            <input type="text" id="question" placeholder="Type your question here...">
            <button onclick="askQuestion()">Ask</button>
        </div>
    </div>
</body>
</html>
